<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewards Tracker - Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
      <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="cards.html">Cards</a></li>
        <li><a href="rewards.html">Rewards</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </nav>
    <div class="container">
        <header>
            <h1>Settings</h1>
        </header>
        <main>
            <section id="programManagementSection">
                <h2>Manage Reward Programs</h2>
                <form id="addProgramForm">
                    <div>
                        <label for="programName">Program Name:</label>
                        <input type="text" id="programName" required>
                    </div>
                    <div>
                        <label for="pointsToDollarRate">Points to Dollar Rate (e.g., 0.01 for 1 cent/point):</label>
                        <input type="number" id="pointsToDollarRate" step="0.001" value="0.01" required>
                    </div>
                    <button type="submit">Add Program</button>
                </form>
            </section>

            <section id="existingProgramsSection">
                <h2>Existing Reward Programs</h2>
                <div id="programsList">
                    <!-- Reward programs will be dynamically rendered here -->
                </div>
            </section>
        </main>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
